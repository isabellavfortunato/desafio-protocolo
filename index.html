const esc = (s)=>String(s==null?"":s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = (s)=>s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"participante";
const pad = (n)=>String(n).padStart(2,"0");
const keyOf = (y,m,d)=>y+"-"+pad(m+1)+"-"+pad(d);
const keyFromTs = (ts)=>{const x=new Date(ts);return keyOf(x.getFullYear(),x.getMonth(),x.getDate());};
const todayKey = ()=>keyFromTs(Date.now());
const fmtShort = (k)=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});};
function platformOf(u){u=(u||"").toLowerCase();if(u.includes("instagram"))return"Instagram";if(u.includes("tiktok"))return"TikTok";if(u.includes("youtu"))return"YouTube";return"Vídeo";}
function parseEmbed(url){
  try{const u=new URL(url);const h=u.hostname.replace("www.","");
    if(h.includes("youtube.com")||h.includes("youtu.be")){let id="",v=false;
      if(h.includes("youtu.be"))id=u.pathname.slice(1);
      else if(u.pathname.startsWith("/shorts/")){id=u.pathname.split("/")[2];v=true;}
      else if(u.pathname.startsWith("/embed/"))id=u.pathname.split("/")[2];
      else id=u.searchParams.get("v")||"";
      if(id)return{src:"https://www.youtube.com/embed/"+id,vertical:v,kind:"YouTube"};}
    if(h.includes("instagram.com")){const m=u.pathname.match(/\/(reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
      if(m){const k=m[1]==="reels"?"reel":m[1];return{src:"https://www.instagram.com/"+k+"/"+m[2]+"/embed",vertical:true,kind:"Instagram"};}}
    if(h.includes("tiktok.com")){const m=u.pathname.match(/\/video\/(\d+)/);
      if(m)return{src:"https://www.tiktok.com/embed/v2/"+m[1],vertical:true,kind:"TikTok"};}
  }catch(e){}
  return null;
}

/* ---------- estado ---------- */
const now = new Date();
const state = {
  config:{}, participants:{}, days:{}, videos:[], insights:[], backstage:[], vents:[],
  me: null, uid: null, master:false,
  authMode:"login", authBusy:false, authError:null, authNotice:null,
  bsBusy:false, bsError:null, ventBusy:false, ventNotice:null, aberto:null, insightNotice:null,
  section:null, editingActs:false, prizesOpen:false, editingPrizes:false, extrasOpen:false,
  extras:{}, pagos:{}, extraLinks:{}, actLinks:{}, insightDate:null,
  viewY: now.getFullYear(), viewM: now.getMonth(), selected: todayKey(),
  printResult:null, printBusy:false, printError:null,
};
const byId = (id)=>document.getElementById(id);
const app = {};
window.app = app;

/* ---------- Firestore: escuta em tempo real ---------- */
function listen(){
  onSnapshot(doc(db,"config","main"),(s)=>{state.config=s.exists()?s.data():{};renderCalendar();renderActivities();renderCounter();refreshSectionData();if(state.prizesOpen&&!state.editingPrizes)renderPrizesBody();});
  onSnapshot(collection(db,"participants"),(qs)=>{const m={};qs.forEach(d=>m[d.id]=d.data());state.participants=m;renderCounter();refreshSectionData();});
  onSnapshot(collection(db,"days"),(qs)=>{const m={},e={},g={},L={},A={};qs.forEach(d=>{m[d.id]=(d.data().marks)||{};e[d.id]=(d.data().extras)||{};g[d.id]=(d.data().pagos)||{};L[d.id]=(d.data().extraLinks)||{};A[d.id]=(d.data().actLinks)||{};});state.days=m;state.extras=e;state.pagos=g;state.extraLinks=L;state.actLinks=A;renderCalendar();renderActivities();if(state.extrasOpen)renderExtrasBody();refreshSectionData();});
  onSnapshot(collection(db,"videos"),(qs)=>{const a=[];qs.forEach(d=>a.push(Object.assign({id:d.id},d.data())));state.videos=a;renderCalendar();renderCounter();refreshSectionData();});
  onSnapshot(collection(db,"insights"),(qs)=>{const a=[];qs.forEach(d=>a.push(Object.assign({id:d.id},d.data())));state.insights=a;refreshSectionData();});
  onSnapshot(collection(db,"backstage"),(qs)=>{const a=[];qs.forEach(d=>a.push(Object.assign({id:d.id},d.data())));state.backstage=a;refreshSectionData();});
  const ventsRef = state.master ? collection(db,"vents") : query(collection(db,"vents"),where("ownerId","==",state.uid));
  onSnapshot(ventsRef,(qs)=>{const a=[];qs.forEach(d=>a.push(Object.assign({id:d.id},d.data())));state.vents=a;refreshSectionData();},(e)=>console.error(e));
}

/* ---------- ações ---------- */
app.setAuthMode=(m)=>{state.authMode=m;state.authError=null;state.authNotice=null;renderApp();};
app.submitAuth = async ()=>{
  const email=(byId("emailInput").value||"").trim().toLowerCase();
  const pass=(byId("passInput").value||"");
  const nameEl=byId("nameInput");
  const name=nameEl?(nameEl.value||"").trim():"";
  state.authError=null;state.authNotice=null;
  if(!email||!pass){state.authError="Preencha o e-mail e a senha.";renderApp();return;}
  if(state.authMode==="signup"&&!name){state.authError="Escreva o seu nome para as outras participantes te reconhecerem.";renderApp();return;}
  state.authBusy=true;renderApp();
  try{
    if(state.authMode==="signup"){
      const cred=await createUserWithEmailAndPassword(auth,email,pass);
      await setDoc(doc(db,"participants",cred.user.uid),{name,email,joinedAt:Date.now()},{merge:true});
      localStorage.setItem("meName",name);
    }else{
      await signInWithEmailAndPassword(auth,email,pass);
    }
  }catch(e){ state.authError=authMessage(e); }
  state.authBusy=false;renderApp();
};
app.resetPass = async ()=>{
  const email=(byId("emailInput").value||"").trim().toLowerCase();
  if(!email){state.authError="Escreva o seu e-mail acima para eu enviar o link de nova senha.";renderApp();return;}
  try{ await sendPasswordResetEmail(auth,email);state.authError=null;state.authNotice="Enviei um link de nova senha para o seu e-mail."; }
  catch(e){ state.authError=authMessage(e); }
  renderApp();
};
app.logout = async ()=>{ localStorage.removeItem("meName"); await signOut(auth); location.reload(); };
function authMessage(e){
  const c=(e&&e.code)||"";
  if(c.indexOf("email-already-in-use")>=0)return"Este e-mail já tem conta. Use a opção de entrar.";
  if(c.indexOf("invalid-email")>=0)return"Confira o e-mail digitado.";
  if(c.indexOf("weak-password")>=0)return"A senha precisa de pelo menos seis caracteres.";
  if(c.indexOf("invalid-credential")>=0||c.indexOf("wrong-password")>=0||c.indexOf("user-not-found")>=0)return"E-mail ou senha que não conferem.";
  if(c.indexOf("too-many-requests")>=0)return"Muitas tentativas seguidas. Espere um pouco e tente de novo.";
  return"Não consegui concluir agora. Tente de novo em instantes.";
}
app.selectDay=(k)=>{state.selected=k;renderCalendar();renderActivities();};
app.prevMonth=()=>{const d=new Date(state.viewY,state.viewM-1,1);state.viewY=d.getFullYear();state.viewM=d.getMonth();renderCalendar();};
app.nextMonth=()=>{const d=new Date(state.viewY,state.viewM+1,1);state.viewY=d.getFullYear();state.viewM=d.getMonth();renderCalendar();};
app.toggle=async(idx)=>{

function shrinkImage(file){
  return new Promise(function(res,rej){
    const r=new FileReader();
    r.onload=function(){
      const img=new Image();
      img.onload=function(){
        const max=1000;let w=img.width,h=img.height;
        if(w>h&&w>max){h=Math.round(h*max/w);w=max;} else if(h>=w&&h>max){w=Math.round(w*max/h);h=max;}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        c.getContext("2d").drawImage(img,0,0,w,h);
        res(c.toDataURL("image/jpeg",0.72));
      };
      img.onerror=rej;img.src=String(r.result);
    };
    r.onerror=rej;r.readAsDataURL(file);
  });
}
async function sendBackstage(file){

/* ---------- gráfico simples em SVG ---------- */
function lineChart(data){
  if(data.length<2)return '<p style="color:var(--muted);line-height:1.5;">Registre os insights de pelo menos dois vídeos para ver a curva de crescimento aqui.</p>';
  const W=560,H=220,P=28;
  const xs=(i)=>P+ (i*(W-2*P))/(data.length-1);
  const max=Math.max.apply(null,data.map(d=>d.value)),min=0;
  const ys=(v)=>H-P-((v-min)/((max-min)||1))*(H-2*P);
  let pts=data.map((d,i)=>xs(i)+","+ys(d.value)).join(" ");
  let dots=data.map((d,i)=>'<circle cx="'+xs(i)+'" cy="'+ys(d.value)+'" r="3.5" fill="#ff06a3"/>').join("");
  let labels=data.map((d,i)=>'<text x="'+xs(i)+'" y="'+(H-6)+'" fill="var(--muted)" font-size="11" text-anchor="middle">'+esc(d.label)+'</text>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;margin-top:8px;">'
    +'<polyline fill="none" stroke="#ff06a3" stroke-width="2.5" points="'+pts+'"/>'
    +dots+labels
    +'<text x="'+P+'" y="16" fill="var(--muted)" font-size="11">seguidores ganhos (acumulado): '+max+'</text></svg>';
}

/* ---------- celebração ---------- */
function detalheHTML(id){
  const acts=state.config.activities||DEFAULT_ACTIVITIES;
  const dias={};
  const guarda=(k)=>{if(!dias[k])dias[k]={acts:[],extras:[],videos:[],bastidor:0,pago:false};return dias[k];};
  Object.keys(state.days[id]||{}).forEach(function(k){
    ((state.days[id]||{})[k]||[]).forEach(function(on,i){ if(on)guarda(k).acts.push({t:acts[i]||("Atividade "+(i+1)),link:linkAto(id,k,i)}); });
  });
  Object.keys(state.extras[id]||{}).forEach(function(k){
    ((state.extras[id]||{})[k]||[]).forEach(function(on,i){ if(on&&EXTRA_ACTIVITIES[i])guarda(k).extras.push({t:EXTRA_ACTIVITIES[i].t,p:EXTRA_ACTIVITIES[i].p,link:linkDe(id,k,i)}); });
  });
  state.videos.filter(v=>v.ownerId===id).forEach(function(v){ guarda(v.date||keyFromTs(v.ts)).videos.push(v); });
  state.backstage.filter(b=>b.ownerId===id).forEach(function(b){ guarda(b.date||keyFromTs(b.ts)).bastidor++; });
  Object.keys(state.pagos[id]||{}).forEach(function(k){ if((state.pagos[id]||{})[k])guarda(k).pago=true; });
  const chaves=Object.keys(dias).sort();
  if(!chaves.length)return '<div style="padding:12px 2px 18px;color:var(--muted);font-size:13px;">Nada marcado até agora.</div>';
  return '<div style="padding:6px 2px 18px;">'+chaves.map(function(k){
    const d=dias[k];
    const ok=diaCompleto(id,k);
    const pts=ok?d.extras.reduce((t,a)=>t+a.p,0):0;
    const espera=ok?0:d.extras.reduce((t,a)=>t+a.p,0);
    let linha='<div style="border-left:2px solid rgba(255,6,163,0.4);padding:8px 0 8px 12px;margin-bottom:10px;">'
      +'<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:6px;">'
      +'<strong style="color:#fff;font-size:14px;">'+esc(fmtShort(k))+'</strong>'
      +(pts?'<span class="ptsTag">'+pts+' pontos</span>':'')
      +(espera?'<span class="ptsTag" style="background:rgba(255,255,255,0.08);color:var(--muted);">'+espera+' em espera</span>':'')+'</div>';
    d.acts.forEach(function(a){ linha+='<div style="color:var(--muted);font-size:13px;line-height:1.5;">'+esc(a.t)
      +(a.link?' <a href="'+esc(a.link)+'" target="_blank" rel="noopener" style="color:#ff06a3;word-break:break-all;">'+esc(a.link)+'</a>':'')+'</div>'; });
    d.extras.forEach(function(a){ linha+='<div style="color:#fff;font-size:13px;line-height:1.5;">'+esc(a.t)+(a.p?' <span style="color:#ff06a3;">'+a.p+'</span>':'')
      +(a.link?' <a href="'+esc(a.link)+'" target="_blank" rel="noopener" style="color:#ff06a3;word-break:break-all;">'+esc(a.link)+'</a>':(a.p?' <span style="color:var(--muted);">sem link</span>':''))+'</div>'; });
    d.videos.forEach(function(v){ linha+='<div style="font-size:13px;line-height:1.5;"><a href="'+esc(v.link)+'" target="_blank" rel="noopener" style="color:#ff06a3;word-break:break-all;">'+esc(v.link)+'</a></div>'; });
    if(d.bastidor)linha+='<div style="color:var(--muted);font-size:13px;">Bastidores enviados: '+d.bastidor+'</div>';
    if(d.pago)linha+='<div style="color:#3ddc97;font-size:13px;">Marcou está pago</div>';
    return linha+'</div>';
  }).join("")+'</div>';
}

function renderExtrasBody(){
  var el=byId("extrasBody");if(!el)return;
  var marks=(myExtras()[state.selected])||[];
  var bruto=pointsOfDay(marks);
  var completo=diaCompleto(state.me&&state.me.id,state.selected);
  var html='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;">'
    +'<span style="color:var(--muted);font-size:13px;">'+esc(fmtShort(state.selected))+'</span>'
    +'<span class="ptsTag"'+(completo?'':' style="background:rgba(255,255,255,0.08);color:var(--muted);"')+'>'
    +(completo?bruto+' pontos no dia':bruto+' pontos em espera')+'</span></div>'
    +(completo?'':'<p style="color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 14px;background:rgba(255,6,163,0.08);border-radius:12px;padding:10px 12px;">As ações extras só passam a valer pontos depois que as '
      +nAtividades()+' atividades do dia estiverem marcadas. Você pode marcar agora e os pontos entram assim que o dia estiver completo.</p>');
  html+='<div class="extraSec">Rotina do dia</div>';
  EXTRA_ACTIVITIES.forEach(function(a,i){
    if(i===BASICAS)html+='<div class="extraSec">Ações que valem pontos</div>';
    var on=marks[i];
    html+='<div class="check '+(on?"check-on":"")+'" onclick="app.toggleExtra('+i+')" style="align-items:flex-start;">'
      +'<div class="checkbox '+(on?"checkbox-on":"")+'">'+(on?"✓":"")+'</div>'
      +'<span style="line-height:1.4;flex:1;">'+esc(a.t)+'</span>'
      +(a.p?'<span class="ptsTag" style="flex:none;">'+a.p+'</span>':'')+'</div>';
    if(on)html+='<div style="margin:-4px 0 12px;padding-left:4px;">'
      +'<input class="field" id="lk'+i+'" placeholder="Cole aqui o link que comprova" value="'+esc(linkDe(state.me&&state.me.id,state.selected,i))+'" '
      +'onclick="event.stopPropagation()" onchange="app.saveExtraLink('+i+',this)" onblur="app.saveExtraLink('+i+',this)" style="font-size:13px;"/></div>';
  });
  el.innerHTML=html;
}

function renderPrizesBody(){
  var el=byId("prizesBody");if(!el)return;
  var prizes=(state.config.prizes&&state.config.prizes.length)?state.config.prizes:DEFAULT_PRIZES;
  if(state.editingPrizes){
    el.innerHTML='<textarea id="prizesText" class="field" style="width:100%;min-height:180px;line-height:1.5;resize:vertical;box-sizing:border-box;" placeholder="Um prêmio por linha">'+esc(prizes.join("\n"))+'</textarea>'
      +'<div style="color:#d6b9c9;font-size:12px;margin:8px 0 12px;">Escreva um prêmio por linha. Por exemplo, primeiro lugar no ranking, uma consultoria individual.</div>'
      +'<div style="display:flex;gap:10px;"><button class="btn-primary" onclick="app.savePrizes()">Salvar</button>'
      +'<button class="btn-ghost" onclick="app.cancelPrizes()">Cancelar</button></div>';
    return;
  }
  var rows=prizes.map(function(p){
    if(/:\s*$/.test(p))return '<div style="font-family:var(--display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#ff06a3;margin:18px 0 4px;">'+esc(p.replace(/:\s*$/,""))+'</div>';

    +'<svg viewBox="0 0 24 24" width="17" height="17" fill="#ff06a3" style="flex:none;margin-top:2px;"><path d="M4 19h16v2H4v-2zM3 7l4.5 3.2L12 4l4.5 6.2L21 7l-1.6 10H4.6L3 7z"/></svg>'
    +'<span style="color:#fff;font-size:15px;line-height:1.45;">'+esc(p)+'</span></div>';}).join("");
  el.innerHTML='<div style="color:#d6b9c9;font-size:13px;margin:2px 0 6px;">O que está em jogo neste desafio</div>'+rows
    +(state.master?'<button class="linkBtn" style="margin-top:12px;" onclick="app.editPrizes()">editar os prêmios</button>':"");
}
function celebrate(){
  var colors=['#ff06a3','#fb0000','#3ddc97','#e9eaf0','#ffffff'];
  var c=document.createElement('canvas');
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99999;';
  c.width=window.innerWidth;c.height=window.innerHeight;document.body.appendChild(c);
  var ctx=c.getContext('2d');var parts=[];
  for(var i=0;i<150;i++)parts.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*0.6,r:4+Math.random()*7,color:colors[i%colors.length],vy:2+Math.random()*4,vx:-2+Math.random()*4,rot:Math.random()*6.28,vr:-0.2+Math.random()*0.4});
  var t=0;(function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<parts.length;i++){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.rot+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.7);ctx.restore();}
    t++;if(t<200)requestAnimationFrame(anim);else c.remove();
  })();
  var ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;z-index:100000;display:flex;align-items:center;justify-content:center;pointer-events:none;';
  ov.innerHTML='<div style="background:rgba(23,7,12,0.96);border:1px solid rgba(255,255,255,0.14);border-radius:18px;padding:26px 30px;text-align:center;max-width:320px;box-shadow:0 20px 60px rgba(0,0,0,0.45);"><div style="font-family:var(--body);font-size:24px;font-weight:700;color:#fff;font-weight:600;line-height:1.25;">Parabéns, você concluiu o desafio!</div></div>';
  document.body.appendChild(ov);
  setTimeout(function(){ov.style.transition='opacity .4s';ov.style.opacity='0';setTimeout(function(){ov.remove();},400);},3200);
}

let listening=false;
onAuthStateChanged(auth, async (user)=>{
  if(!user){ state.uid=null;state.me=null;state.master=false;renderApp();return; }
  state.uid=user.uid;
  state.master=isMasterEmail(user.email);
  let nome=localStorage.getItem("meName")||"";
  try{
    const snap=await getDoc(doc(db,"participants",user.uid));
    if(snap.exists()&&snap.data().name)nome=snap.data().name;
    else await setDoc(doc(db,"participants",user.uid),{name:nome||(user.email||"").split("@")[0],email:user.email,joinedAt:Date.now()},{merge:true});
  }catch(e){ console.error(e); }
  if(!nome)nome=(user.email||"").split("@")[0];
  localStorage.setItem("meName",nome);
  state.me={id:user.uid,name:nome,email:user.email};
  if(!listening){ listen(); listening=true; }
  renderApp();
});
renderApp();
